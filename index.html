<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>layanh.github.io</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #0f1115; color: #e6e8ec;
  }
  .card {
    max-width: 34rem; padding: 2.5rem 2rem; text-align: center;
    border: 1px solid #262b36; border-radius: 14px; background: #161a22;
  }
  h1 { margin: 0 0 .4rem; font-size: 1.6rem; letter-spacing: -.02em; }
  .host {
    display: inline-block; margin: .9rem 0 1.2rem; padding: .35rem .8rem;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 1rem;
    color: #7ee0a8; background: #10231a; border: 1px solid #1f4d33; border-radius: 999px;
  }
  p { margin: .5rem 0; color: #a8b0bd; }
  .note { font-size: .85rem; color: #6f7783; }
</style>
</head>
<body>
  <main class="card">
    <h1>Trang này đã hoạt động</h1>
    <div class="host">layanh.github.io</div>
    <p>Đây là trang GitHub Pages của bạn, đang chạy trên giao thức HTTPS với chứng chỉ miễn phí.</p>
    <p class="note">Nội dung chỉ là trang chờ (placeholder). Thay thế <code>index.html</code> bằng trang thật của bạn để ghi đè lên.</p>
  </main>
</body>
</html>
